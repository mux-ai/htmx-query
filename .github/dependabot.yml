version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Keep package.json in sync with lockfile bumps so the lockfile-review
    # guard (which rejects lockfile-only diffs) accepts Dependabot PRs.
    versioning-strategy: increase
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      codeql:
        patterns:
          - "github/codeql-action*"
