name: lockfile-review

on:
  pull_request:
    paths:
      - package.json
      - pnpm-lock.yaml

permissions:
  contents: read

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - name: Require manifest context for lockfile changes
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          changed="$(git diff --name-only "origin/${BASE_REF}...HEAD")"
          if printf '%s\n' "$changed" | grep -qx 'pnpm-lock.yaml' && ! printf '%s\n' "$changed" | grep -qx 'package.json'; then
            echo 'pnpm-lock.yaml changed without package.json; review the dependency change.' >&2
            exit 1
          fi
