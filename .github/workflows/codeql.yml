name: codeql

on:
  push:
  pull_request:
  schedule:
    - cron: '17 4 * * 1'

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze JavaScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: github/codeql-action/init@e0647621c2984b5ed2f768cb892365bf2a616ad1 # v4.37.2
        with:
          languages: javascript-typescript
          build-mode: none
      - uses: github/codeql-action/analyze@26dfab68fffc1cbc36c56970c32f0e53cf1fcc01 # v4.37.2
        with:
          # Private repositories require GitHub Advanced Security for SARIF
          # upload. Keep analysis enabled without failing at that API boundary.
          upload: false
