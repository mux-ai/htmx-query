name: release

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      # Deliberately no registry-url: it makes setup-node write an .npmrc with
      # //registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}. With no token (by
      # design — Trusted Publishing has no token fallback) npm authenticates
      # with that empty credential instead of performing the OIDC exchange,
      # and the publish PUT fails as a 404. npm defaults to this registry.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level high
      - run: pnpm prepublishOnly
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - run: pnpm test:browser
      - run: npm run release:verify
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
      # Temporary diagnostic for the v0.2.0 Trusted Publishing failure. Prints
      # only the non-secret claims npm presents to the registry so they can be
      # compared against the configured trusted publisher. The token itself is
      # never echoed. Remove once publishing succeeds.
      - name: Show OIDC claims presented to npm
        run: |
          set -euo pipefail
          curl -sS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=npm:registry.npmjs.org" \
            | node -e '
              let raw = "";
              process.stdin.on("data", (chunk) => { raw += chunk; });
              process.stdin.on("end", () => {
                const token = JSON.parse(raw).value;
                const claims = JSON.parse(Buffer.from(token.split(".")[1], "base64url").toString());
                console.log(JSON.stringify({
                  repository: claims.repository,
                  workflow_ref: claims.workflow_ref,
                  job_workflow_ref: claims.job_workflow_ref,
                  environment: claims.environment ?? "(none)",
                  ref: claims.ref,
                  aud: claims.aud,
                }, null, 2));
              });
            '
      - run: npm publish --provenance --loglevel verbose
